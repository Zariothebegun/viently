name: Viently app validation

on:
  push:
    branches:
      - redesign/tiktok-feed-visual-engine
  pull_request:
    branches:
      - main
      - master

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-ios/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check Expo dependency compatibility
        run: npx expo install --check
        continue-on-error: true
      - name: TypeScript validation
        run: npx tsc --noEmit
